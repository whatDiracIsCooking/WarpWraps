# Expected dispatch of wwr.wrappers.sparse -- checked by test/shared/dispatch.py
#
# [dispatch] is one key per wrapper<T>: the wwrsparse function its compiled code
# must call. Names are wwrsparse aliases (src/sparse.cppm), so this one table
# checks a CUDA and a HIP build.
#
# Order follows the extern template lists in src/wrappers/sparse. When adding a
# wrapper, add its entry by hand next to its extern templates: the table is only
# worth something if it is an independent statement of what should be called,
# not a copy of what is. (--print shows what is, for comparison.)
#
# The rule is wwrsparse<S|D|C|Z><name>. There is no _64 variant -- the legacy
# typed cuSPARSE/hipSPARSE functions take a single index width.

[check]
module = "wwr.wrappers.sparse"
prefix = "wwrsparse"
# wwr.sparse defines the CUDA gebsr2gebsc_bufferSize / csr2gebsr_bufferSize
# shims (cuSPARSE spells the byte count int*, hipSPARSE size_t*) as ordinary
# inline functions next to its WWR_FUNCTION aliases; one that is not inlined is
# called by name, so the check has to recognise it as a dispatch target too.
forwarder_module = "wwr.sparse"

# How the demangler spells each template argument, mapped to the name this table
# uses. wwrComplex and wwrFloatComplex are the same underlying vendor type, so
# the demangler cannot tell them apart -- this table's choice is wwrComplex.
[type_names.CUDA]
float2 = "wwrComplex"
double2 = "wwrDoubleComplex"

[type_names.HIP]
"HIP_vector_type<float, 2u>" = "wwrComplex"
"HIP_vector_type<double, 2u>" = "wwrDoubleComplex"

[dispatch]
# ---- src/wrappers/sparse/level_2.cppm ----
"bsrmv<float>"                                            = ["wwrsparseSbsrmv"]
"bsrmv<double>"                                           = ["wwrsparseDbsrmv"]
"bsrmv<wwrComplex>"                                       = ["wwrsparseCbsrmv"]
"bsrmv<wwrDoubleComplex>"                                 = ["wwrsparseZbsrmv"]

# ---- src/wrappers/sparse/solvers.cppm ----
"gtsv2_bufferSizeExt<float>"                              = ["wwrsparseSgtsv2_bufferSizeExt"]
"gtsv2_bufferSizeExt<double>"                             = ["wwrsparseDgtsv2_bufferSizeExt"]
"gtsv2_bufferSizeExt<wwrComplex>"                         = ["wwrsparseCgtsv2_bufferSizeExt"]
"gtsv2_bufferSizeExt<wwrDoubleComplex>"                   = ["wwrsparseZgtsv2_bufferSizeExt"]
"gtsv2<float>"                                            = ["wwrsparseSgtsv2"]
"gtsv2<double>"                                           = ["wwrsparseDgtsv2"]
"gtsv2<wwrComplex>"                                       = ["wwrsparseCgtsv2"]
"gtsv2<wwrDoubleComplex>"                                 = ["wwrsparseZgtsv2"]
"gtsv2_nopivot_bufferSizeExt<float>"                      = ["wwrsparseSgtsv2_nopivot_bufferSizeExt"]
"gtsv2_nopivot_bufferSizeExt<double>"                     = ["wwrsparseDgtsv2_nopivot_bufferSizeExt"]
"gtsv2_nopivot_bufferSizeExt<wwrComplex>"                 = ["wwrsparseCgtsv2_nopivot_bufferSizeExt"]
"gtsv2_nopivot_bufferSizeExt<wwrDoubleComplex>"           = ["wwrsparseZgtsv2_nopivot_bufferSizeExt"]
"gtsv2_nopivot<float>"                                    = ["wwrsparseSgtsv2_nopivot"]
"gtsv2_nopivot<double>"                                   = ["wwrsparseDgtsv2_nopivot"]
"gtsv2_nopivot<wwrComplex>"                               = ["wwrsparseCgtsv2_nopivot"]
"gtsv2_nopivot<wwrDoubleComplex>"                         = ["wwrsparseZgtsv2_nopivot"]
"gtsv2StridedBatch_bufferSizeExt<float>"                 = ["wwrsparseSgtsv2StridedBatch_bufferSizeExt"]
"gtsv2StridedBatch_bufferSizeExt<double>"                = ["wwrsparseDgtsv2StridedBatch_bufferSizeExt"]
"gtsv2StridedBatch_bufferSizeExt<wwrComplex>"            = ["wwrsparseCgtsv2StridedBatch_bufferSizeExt"]
"gtsv2StridedBatch_bufferSizeExt<wwrDoubleComplex>"      = ["wwrsparseZgtsv2StridedBatch_bufferSizeExt"]
"gtsv2StridedBatch<float>"                               = ["wwrsparseSgtsv2StridedBatch"]
"gtsv2StridedBatch<double>"                              = ["wwrsparseDgtsv2StridedBatch"]
"gtsv2StridedBatch<wwrComplex>"                          = ["wwrsparseCgtsv2StridedBatch"]
"gtsv2StridedBatch<wwrDoubleComplex>"                    = ["wwrsparseZgtsv2StridedBatch"]
"gtsvInterleavedBatch_bufferSizeExt<float>"              = ["wwrsparseSgtsvInterleavedBatch_bufferSizeExt"]
"gtsvInterleavedBatch_bufferSizeExt<double>"             = ["wwrsparseDgtsvInterleavedBatch_bufferSizeExt"]
