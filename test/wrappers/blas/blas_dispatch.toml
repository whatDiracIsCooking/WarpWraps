# Expected dispatch of wwr.wrappers.blas. Format and semantics: test/shared/dispatch.py.
#
# Rule: wwrblas<S|D|C|Z><name>, plus _64 for IntT = int64_t. The exceptions are
# BLAS's own: I<s|d|c|z>amax/amin, Sc/Dz for asum and nrm2 on complex input, and
# Cs/Zd for the real-scalar complex rot and scal overloads. A [dispatch] key
# listing two functions covers two overloads with the same template arguments;
# each must call exactly one of them.

[check]
module = "wwr.wrappers.blas"
prefix = "wwrblas"
# wwr.blas defines the HIP getrs/getriBatched shims as ordinary inline
# functions next to its WWR_FUNCTION aliases; one that is not inlined is called
# by name, so the check has to recognise it as a dispatch target too.
forwarder_module = "wwr.blas"

# Float complex has two interchangeable spellings; this table uses wwrComplex.
[type_names.CUDA]
float2 = "wwrComplex"
double2 = "wwrDoubleComplex"
long = "int64_t"

[type_names.HIP]
"HIP_vector_type<float, 2u>" = "wwrComplex"
"HIP_vector_type<double, 2u>" = "wwrDoubleComplex"
long = "int64_t"

[dispatch]
# ---- src/wrappers/blas/level_1.cppm ----
