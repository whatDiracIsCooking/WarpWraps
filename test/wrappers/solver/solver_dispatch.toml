# Expected dispatch of gpumod.wrappers.solver -- checked by test/shared/dispatch.py
#
# [dispatch] is one key per wrapper<T>: the gpusolverDn function its compiled
# code must call. Names are gpusolver aliases (src/solver.cppm), so this one
# table checks a CUDA and a HIP build.
#
# Order follows the instantiation lists in src/wrappers/solver. When adding a
# wrapper, add its entry by hand next to its instantiations: the table is only
# worth something if it is an independent statement of what should be called,
# not a copy of what is. (--print shows what is, for comparison.)
#
# The plain rule is gpusolverDn<S|D|C|Z><name>, with no _64 variants -- neither
# cuSOLVER's nor hipSOLVER's legacy typed API has an int64_t-index sibling entry
# point (see src/wrappers/solver/dispatch_macros.h). Which of the four types a
# wrapper covers is the LAPACK surface's business, not the rule's: orgqr/orgbr/
# orgtr/ormqr/ormtr and the sy* names are real only, their ung*/unm*/he* twins
# complex only, and the rest take all four.
#
# The one naming exception is gels and gesv, whose entry points are the IRS
# mixed-precision ones named <output><compute>gels / <output><compute>gesv --
# so the uniform-precision case gpumod wraps doubles the letter:
# gpusolverDnSSgels, gpusolverDnZZgesv.
#
# Not covered here: the modern (X-prefixed) wrappers in
# src/wrappers/solver/linear_solver.cppm. They share eight names with the
# legacy API (potrf, potrs, getrf, getrs, geqrf and three _bufferSize siblings)
# but have no explicit instantiations, so they emit no object code for this
# check to read -- and they name gpusolverDnXpotrf and friends directly in C++
# rather than token-pasting a type letter, which is the class of mistake this
# check exists to catch. Their type mapping is get_gpusolver_type<T>(), checked
# by static_assert in type_traits.cppm next to this file instead.

[check]
module = "gpumod.wrappers.solver"
prefix = "gpusolver"
# gpumod.solver is pure WWR_FUNCTION aliases -- no inline forwarders to
# recognise, unlike gpumod.blas -- so there is no forwarder_module here.

# How the demangler spells each template argument, mapped to the name this table
# uses. gpuComplex and gpuFloatComplex are the same underlying vendor type, so
# the demangler cannot tell them apart -- this table's choice is gpuFloatComplex,
# which is what src/wrappers/solver spells throughout.
[type_names.CUDA]
float2 = "gpuFloatComplex"
double2 = "gpuDoubleComplex"

[type_names.HIP]
"HIP_vector_type<float, 2u>" = "gpuFloatComplex"
"HIP_vector_type<double, 2u>" = "gpuDoubleComplex"

[dispatch]

# ---- src/wrappers/solver/linear_solver_legacy.cppm ----
"potrf_bufferSize<float>"                           = ["gpusolverDnSpotrf_bufferSize"]
"potrf_bufferSize<double>"                          = ["gpusolverDnDpotrf_bufferSize"]
"potrf_bufferSize<gpuFloatComplex>"                 = ["gpusolverDnCpotrf_bufferSize"]
