# Expected dispatch of wwr.wrappers.fft. Format and semantics: test/shared/dispatch.py.
#
# Rule: wwrfftExec<kind>, <kind> the precision-specific transform (float ->
# C2C/R2C/C2R, double -> Z2Z/D2Z/Z2D). No _64 -- an FFT's size goes to the
# *Many64 plan functions, not an index suffix on the exec call
# (src/wrappers/fft/dispatch_macros.h).

[check]
module = "wwr.wrappers.fft"
prefix = "wwrfft"

[dispatch]

# ---- src/wrappers/fft/exec.cppm ----
"exec_c2c<float>"  = ["wwrfftExecC2C"]
"exec_c2c<double>" = ["wwrfftExecZ2Z"]
"exec_r2c<float>"  = ["wwrfftExecR2C"]
"exec_r2c<double>" = ["wwrfftExecD2Z"]
"exec_c2r<float>"  = ["wwrfftExecC2R"]
"exec_c2r<double>" = ["wwrfftExecZ2D"]
