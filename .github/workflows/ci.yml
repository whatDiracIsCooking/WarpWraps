# The server-side gate. The pre-push hook (devtools/prepush-tests.sh) is the
# same idea run locally and is bypassable with --no-verify; this is not.
#
# It runs the FAST tier only, for the same reason the push gate does: a
# per-commit job that takes hours is one people learn to ignore. The expensive
# tier belongs in the scheduled job below -- and on a self-hosted runner if it
# needs a GPU or more RAM than a hosted runner has.
#
# ---------------------------------------------------------------------------
# WHAT THIS FILE DOES NOT COVER, AND WHY
# ---------------------------------------------------------------------------
# The C++ tree is NOT built here by default. A GitHub-hosted runner cannot do
# it: `project(... LANGUAGES CXX CUDA)` needs nvcc, the presets ask for
# CMAKE_CUDA_ARCHITECTURES=native which queries a driver that is not there, and
# clang-20 + libc++'s module manifest + CMake 4.2 would all have to be
# installed per run. The `cpp` job below does the real thing and is switched
# off until you have a runner with a GPU -- see its comment.
#
# So: a PR touching only src/ is checked by nothing on the server. The lint and
# Python jobs below DO run automatically; the C++ build (`cpp`) still needs a
# GPU runner and stays off -- see its comment. Until that runner exists,
# `devtools/cpp-tier.sh` before opening the PR is the whole gate for src/, and
# it is a human one. Know that rather than discover it.
name: ci

# ---------------------------------------------------------------------------
# ON: runs automatically on push to main and on every PR.
# ---------------------------------------------------------------------------
# The lint and test jobs run on GitHub-hosted runners on push/pull_request;
# `workflow_dispatch` also keeps the manual trigger. The `cpp` job stays off
# (`if: false`) because it needs a self-hosted GPU runner -- see its comment.
#
# This was previously manual-only because Actions usage limits on the account
# made runs fail for reasons unrelated to the commit. If that recurs and the
# noise outweighs the gate, comment out `push:`/`pull_request:` and leave
# `workflow_dispatch:` -- that reverts to manual with no other change, and is
# stronger than `if: false` on each job, which still posts skipped checks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # NB there is no `schedule:` here any more. It existed only to run a nightly
  # `slow` job, and that job went with devtools/slow-tier.sh when the fast/slow
  # split was retired -- the Python suite is one sub-second file now. Add both
  # back together if an expensive tier ever reappears.

concurrency:
  # A new push to a PR cancels the previous run for that PR; main is never
  # cancelled, so every commit on it keeps a result.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # --frozen: install the lock as committed, and fail rather than
      # re-resolve. A CI that silently re-resolves is not testing what you ship.
      - run: uv sync --frozen
      - run: uv run ruff check .
      # cmake-lint over the files that define every target in the tree. Comes
      # from the `cmakelang` dev dependency, so it is already in the lock;
      # configured by .cmake-format.yaml. Lint only -- the formatter is not run
      # in CI for the same reason it is not a pre-commit hook.
      - name: cmake-lint
        run: |
          uv run cmake-lint CMakeLists.txt \
            $(git ls-files '*/CMakeLists.txt' 'cmake/*.cmake')

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Match `requires-python` in pyproject.toml. The floor and the ceiling
        # are the two that actually break.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      # -rs prints skip reasons: a suite that degrades-to-skip when a tool is
      # missing looks green while testing nothing, and the log is the only
      # place that shows it.
      - name: python tier
        run: uv run pytest -n auto -rs

  cpp:
    # THE REAL BUILD, AND IT IS OFF -- so a PR touching only src/ is checked by
    # nothing on the server. This job does the real thing; it needs a runner
    # with an NVIDIA GPU and the NVIDIA Container Toolkit, because the presets
    # ask for CMAKE_CUDA_ARCHITECTURES=native, which queries a live device at
    # CONFIGURE time. A GitHub-hosted runner has no card, so it cannot even
    # configure.
    #
    # TO TURN IT ON, in this order:
    #
    #   1. On the GPU box, register it as a repository runner:
    #        Settings -> Actions -> Runners -> New self-hosted runner
    #      and follow the generated ./config.sh + ./run.sh (or install it as a
    #      service with ./svc.sh install). Give it a label you will recognise,
    #      e.g. `cuda`.
    #   2. Check the runner shows as Idle in that same Settings page.
    #   3. THEN, in this file: `if: false` -> `if: true`, and `runs-on:
    #      ubuntu-latest` -> `runs-on: [self-hosted, cuda]`.
    #
    # Do steps 1-2 before step 3. Merging the flip while no runner is
    # registered does not fail the job -- it queues it forever, and every
    # subsequent PR sits pending on a check that can never complete.
    #
    # Measured on a 24-core box with an RTX 3080, warm: ~2 min for the image
    # (cold is far longer -- LLVM, CMake and three dependencies compiled
    # against libc++), ~2-3 min for configure + build + ctest. A persistent
    # self-hosted runner keeps both the docker layers and the ccache, which is
    # what makes those numbers hold; a registry cache is the alternative.
    #
    # BUILD_JOBS is set below rather than left to Ninja: a C++23 module build
    # is memory-hungry per job, and Ninja's default of cores+2 is what
    # OOM-kills a box -- surfacing as a bare `ninja: build stopped` with
    # nothing about memory in it. Raise it only with the runner's RAM in view.
    if: false
    runs-on: ubuntu-latest  # EDIT with step 3 above: [self-hosted, cuda]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # build.sh walks docker/Dockerfile.base then .cuda -- they chain by tag,
      # so the child cannot be built alone (see Dockerfile.base's header). It
      # takes the tag prefix from PROJECT_NAME, so overriding that is what names
      # the image ci-image:latest for the step below.
      - name: build image
        run: PROJECT_NAME=ci-image docker/build.sh cuda
      # `native` needs a live device at CONFIGURE time, so this reads the
      # runner's card. Pin the preset (ampere/hopper) if the runner's GPU is
      # not the one you ship for.
      - name: configure, build, ctest
        run: |
          docker run --rm --gpus all \
            -e BUILD_JOBS="${BUILD_JOBS:-8}" \
            -v "$PWD:/workspace" -w /workspace \
            -u "$(id -u):$(id -g)" \
            ci-image:latest devtools/cpp-tier.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpp-tier-logs
          path: .slow-tier-reports/
